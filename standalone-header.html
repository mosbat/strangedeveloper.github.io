<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Standalone Header</title>
  <style>
    :root {
      --bg: #f7f6f2;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-strong: rgba(255, 255, 255, 0.96);
      --border: rgba(33, 37, 41, 0.10);
      --text: #1f1f1f;
      --muted: #5f6b7a;
      --primary: #01696f;
      --primary-hover: #0c4e54;
      --danger: #ff3b30;
      --danger-hover: #e03228;
      --blue: #2156d8;
      --blue-hover: #1748bc;
      --shadow-sm: 0 6px 18px rgba(15, 54, 56, 0.08);
      --shadow-md: 0 10px 30px rgba(15, 54, 56, 0.12);
      --radius-sm: 12px;
      --radius-pill: 999px;
      --max: 1180px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --tap: 44px;
      --transition: 180ms ease;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      color: var(--text);
      background: var(--bg);
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.5) inset;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .header-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: var(--space-3) var(--space-4);
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: var(--space-3);
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: var(--space-3);
      text-decoration: none;
      color: inherit;
    }

    .brand-mark {
      width: var(--tap);
      height: var(--tap);
      border-radius: 14px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), #0f8b95);
      color: #fff;
      box-shadow: var(--shadow-sm);
    }

    .brand-mark svg {
      width: 22px;
      height: 22px;
      display: block;
    }

    .brand-text {
      min-width: 0;
      display: flex;
      flex-direction: column;
      line-height: 1.15;
    }

    .brand-text strong {
      display: block;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand-text span {
      display: none;
      margin-top: 2px;
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .header-actions {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--space-2);
    }

    .new-client-btn,
    .mobile-quick-btn,
    .menu-btn,
    .mobile-panel a {
      min-width: 44px;
      min-height: 44px;
    }

    .new-client-btn,
    .mobile-quick-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      width: 100%;
      min-width: 0;
      padding: 0 14px;
      border-radius: var(--radius-pill);
      text-decoration: none;
      white-space: nowrap;
      transition:
        transform var(--transition),
        box-shadow var(--transition),
        background var(--transition),
        border-color var(--transition);
    }

    .new-client-btn {
      border: 1px solid rgba(1, 105, 111, 0.16);
      background: linear-gradient(180deg, #1a7d84 0%, var(--primary) 100%);
      color: #fff;
      font-size: 0.875rem;
      font-weight: 700;
      box-shadow: var(--shadow-sm);
    }

    .new-client-btn:hover,
    .new-client-btn:focus-visible {
      background: linear-gradient(180deg, #19737a 0%, var(--primary-hover) 100%);
      box-shadow: var(--shadow-md);
    }

    .new-client-btn:active,
    .mobile-quick-btn:active,
    .menu-btn:active {
      transform: translateY(1px);
    }

    .new-client-btn svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    #live-demos-btn {
      background: var(--danger);
      border-color: rgba(255, 59, 48, 0.22);
      color: #fff;
    }

    #live-demos-btn:hover,
    #live-demos-btn:focus-visible {
      background: var(--danger-hover);
    }

    .pricing-btn {
      display: none;
      background: var(--blue);
      color: #fff;
      font-size: 0.875rem;
      font-weight: 700;
      border: 1px solid rgba(33, 86, 216, 0.18);
      box-shadow: var(--shadow-sm);
    }

    .pricing-btn:hover,
    .pricing-btn:focus-visible {
      background: var(--blue-hover);
    }

    .faq-btn {
      display: none;
      background: #fff;
      color: #102033;
      font-size: 0.875rem;
      font-weight: 700;
      border: 1px solid #d9e2ec;
    }

    .faq-btn:hover,
    .faq-btn:focus-visible {
      background: #f8fbff;
    }

    .menu-btn {
      width: 100%;
      min-width: 0;
      min-height: var(--tap);
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-strong);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition:
        background var(--transition),
        border-color var(--transition),
        transform var(--transition);
    }

    .menu-btn:hover,
    .menu-btn:focus-visible {
      background: #fff;
      border-color: rgba(33, 37, 41, 0.16);
    }

    .menu-btn svg {
      width: 22px;
      height: 22px;
      display: block;
    }

    .mobile-panel {
      display: none;
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 var(--space-4) var(--space-4);
    }

    .mobile-panel.show {
      display: block;
    }

    .mobile-panel nav {
      display: flex;
      flex-direction: column;
    }

    .mobile-panel a {
      display: block;
      width: 100%;
      margin-top: var(--space-2);
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.72);
      color: var(--text);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
    }

    .mobile-panel a:hover,
    .mobile-panel a:focus-visible {
      background: #fff;
      border-color: rgba(33, 37, 41, 0.16);
    }

    .site-header a:focus-visible,
    .site-header button:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    @media (min-width: 480px) {
      .header-inner {
        padding: 14px var(--space-4);
      }

      .brand-text strong {
        font-size: 1rem;
      }

      .brand-text span {
        display: block;
      }
    }

    @media (min-width: 768px) {
      .header-inner {
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: var(--space-4);
      }

      .header-actions {
        width: auto;
        display: flex;
        align-items: center;
        justify-self: end;
        gap: var(--space-2);
      }

      .new-client-btn,
      .mobile-quick-btn {
        width: auto;
      }

      .menu-btn {
        width: var(--tap);
        min-width: var(--tap);
        min-height: var(--tap);
        padding: 0;
        border-radius: var(--radius-pill);
      }

      .pricing-btn,
      .faq-btn {
        display: inline-flex;
      }
    }

    @media (min-width: 1024px) {
      .header-inner {
        padding: 14px var(--space-5);
      }

      .new-client-btn,
      .pricing-btn,
      .faq-btn {
        padding: 0 18px;
      }

      .brand-text {
        max-width: 280px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .site-header,
      .new-client-btn,
      .mobile-quick-btn,
      .menu-btn,
      .mobile-panel a {
        transition: none;
      }

      html {
        scroll-behavior: auto;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html" aria-label="Mousa Cloud Consulting home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"

            <path d="M5 12.5L9.5 17L19 7.5"></path>

        <a id="live-demos-btn" class="new-client-btn" href="https://architecture.mousa-cloud.com" target="_blank"
          rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">

            <path d="M5 8h14"></path>

        <a class="mobile-quick-btn pricing-btn" href="pricing.html">Pricing</a>

        <button class="menu-btn" type="button" id="menuBtn" aria-expanded="false" aria-controls="mobilePanel"

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"

        <a href="cloud-migration-services.html">Cloud Migration Services</a>

        <a href="ai-governance.html">AI Governance</a>

        <a href="about-me.html">About Me</a>
        <a href="ethics.html">Ethics and Values</a>

    </div>
  </header>
</body>

</html>
